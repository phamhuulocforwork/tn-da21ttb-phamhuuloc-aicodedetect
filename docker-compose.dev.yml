version: "3.9"

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY:-}
    volumes:
      - ./src/backend:/app
      - ./src/src:/src
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: deps
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm run dev"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
